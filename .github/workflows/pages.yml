name: Validate and deploy CV
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cv-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build and QA dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build website and two-page resume
        run: python scripts/build.py
      - name: Check content, links, PDF and JavaScript
        run: |
          python scripts/validate.py
          node --check site/app.js
      - name: Browser, responsive and accessibility checks
        run: npm run test:browser
      - name: Keep browser review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-browser-review
          path: qa/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
